services:
  relay:
    image: family-relay:${RELAY_RELEASE:-local}
    build: .
    restart: unless-stopped
    ports:
      - "443:443/tcp"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    volumes:
      - type: bind
        source: ./server.json
        target: /run/relay/config.json
        read_only: true
        bind:
          create_host_path: false
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
